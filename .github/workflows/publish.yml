name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for gh release create

    steps:
      - uses: actions/checkout@v4

      - name: Parse version from tag
        id: version
        run: |
          RAW="${GITHUB_REF_NAME}"
          VER="${RAW#v}"
          PEP440=$(echo "$VER" | sed 's/-alpha\./a/;s/-beta\./b/;s/-rc\./rc/')
          IS_PRE=$([[ "$VER" == *-* ]] && echo "true" || echo "false")
          echo "pep440=$PEP440" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRE" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        run: poetry run pytest --no-cov

      - name: Set version
        run: poetry version ${{ steps.version.outputs.pep440 }}

      - name: Build
        run: poetry build

      - name: Publish to PyPI
        run: poetry publish --username __token__ --password ${{ secrets.PYPI_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ steps.version.outputs.is_prerelease }}" = "true" ]; then
            FLAGS="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            $FLAGS
