[project]
name = "voltu-devtools"
version = "0.1.0"
description = "Shared build and dev environment scripts for Voltu firmware projects"
authors = [
    {name = "Ericson Joseph", email = "joseph.ericson@allthings.me"}
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "voltu_devtools", from = "src"}]

[tool.poetry.scripts]
voltu-setup-env      = "voltu_devtools.setup_env.runner:main"
voltu-validate-xc32  = "voltu_devtools.xc32.validate_fmt3:main"
voltu-merge-hex      = "voltu_devtools.xc32.merge_hex:main"
voltu-format         = "voltu_devtools.format.uncrustify:main"
voltu-check-peripheral = "voltu_devtools.mcc.check_peripheral:main"
voltu-parse-hardware = "voltu_devtools.mcc.parse_hardware:main"
voltu-mcc-refresh    = "voltu_devtools.mcc.mcc_refresh:main"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9.0.0"
